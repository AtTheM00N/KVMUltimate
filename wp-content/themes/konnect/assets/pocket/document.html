<script>
(async () => {
  'use strict'; if(window.konnectStatic) return;
  const pack = (await import('/wp-content/themes/konnect/assets/pocket/landing-pages/aura-2026-10-20-assets/pocket/package.js')).default;
  const originals = new Map();
  const assets = pack.assets, aliases = pack.aliases;
  for (const [key, url] of Object.entries(assets)) originals.set(url, key);
  window.__grailAsset = path => {
    if (originals.has(path)) return path;
    const key = aliases[path] || path;
    const url = assets[key];
    if (!url) {
      throw new Error('Missing Konnect asset: ' + path);
    }
    return url;
  };
  window.__grailVariant = path => {
    const key=originals.get(path) || path;
    return window.__grailAsset(key.startsWith('/relics/') ? key : key.replace('.webp', '-160.webp'));
  };
  const style = document.createElement('style');
  style.textContent = pack.css;
  document.head.appendChild(style);
  const imports = {};
  for (const [name, code] of Object.entries(pack.modules)) {
    imports[name] = code;
  }
  const map = document.createElement('script');
  map.type = 'importmap'; map.textContent = JSON.stringify({imports});
  document.head.appendChild(map);


  if(!window.konnectStatic) await import('grail/index-qyEp212_.js');
})().catch(error => {
    console.error(error); document.documentElement.classList.remove('konnect-ready'); document.documentElement.classList.add('konnect-static'); document.getElementById('konnect-fallback').inert=false;
    const message = document.createElement('p');
    message.id = 'startup-error';
    message.textContent = 'Pocket Quest could not start. Please open this file in a current browser.';
    document.getElementById('root').appendChild(message);
});
</script>
